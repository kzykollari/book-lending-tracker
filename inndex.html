<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Lending Tracker</title>

    <!-- Bootstrap CSS Library -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Our CSS File -->
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container py-5">

        <h1 class="text-center mb-2">📚 Book Lending Tracker</h1>
        <p class="text-center text-muted mb-5">
            Manage your borrowed and lent books
        </p>

        <!-- SUMMARY -->
        <div class="row mb-4">

            <div class="col-md-6">
                <div class="card summary-card p-4 text-center">
                    <h5>Total Loans</h5>
                    <h2 id="totalLoans">0</h2>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card summary-card p-4 text-center">
                    <h5>Overdue Loans</h5>
                    <h2 id="overdueLoans">0</h2>
                </div>
            </div>

        </div>

        <!-- ADD BOOK FORM -->
        <div class="card p-4 mb-4">

            <h3 class="mb-3">Add a New Book</h3>

            <form id="bookForm">

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Title</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Author</label>
                        <input type="text" id="author" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Borrower</label>
                        <input type="text" id="borrower" class="form-control" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date" id="dueDate" class="form-control" required>
                    </div>

                    <div class="col-md-12 mb-3">
                        <label class="form-label">Genre</label>
                        <select id="genre" class="form-select" required>
                            <option value="">Select Genre</option>
                            <option>Fantasy</option>
                            <option>Romance</option>
                            <option>Science Fiction</option>
                            <option>Drama</option>
                            <option>Mystery</option>
                            <option>History</option>
                            <option>Other</option>
                        </select>
                    </div>

                </div>

                <button type="submit" class="btn btn-primary">
                    Add Book
                </button>

            </form>

        </div>

        <!-- BOOK TABLE -->
        <div class="card p-4">

            <h3 class="mb-3">Books List</h3>

            <div class="table-responsive">

                <table class="table table-bordered table-hover">

                    <thead class="table-dark">
                        <tr>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Borrower</th>
                            <th>Due Date</th>
                            <th>Genre</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody id="bookTable">

                    </tbody>

                </table>

            </div>

        </div>

    </div>

    <!-- jQuery Library -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Our JavaScript File -->
    <script src="app.js"></script>

</body>
</html>
